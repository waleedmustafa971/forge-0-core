name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend · lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Lint and compile benchmark harness and scripts
        run: |
          ruff check ../benchmarks ../scripts --config pyproject.toml
          ruff format --check ../benchmarks ../scripts --config pyproject.toml
          python -m py_compile ../benchmarks/run_benchmark.py ../scripts/*.py
      - run: pytest -m "not docker and not postgres" -q

  integration:
    name: Integration · Docker sandbox and PostgreSQL
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge0_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge0_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://forge:forge@127.0.0.1:5432/forge0_test
      SANDBOX_DOCKER_COMMAND: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: docker pull node:24-alpine
      - name: Integration tests (real sandbox, real database)
        run: pytest -m "docker or postgres" -q -rs
      - name: Migrations apply cleanly via the CLI
        env:
          DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
        run: alembic upgrade head && alembic current

  demo:
    name: Demo service · typecheck and defect contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/order-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Exactly the five planted defects fail
        run: |
          node --test --test-reporter=tap "test/**/*.test.ts" > tap.txt || true
          failed=$(grep -cE '^    not ok' tap.txt || true)
          passed=$(grep -cE '^    ok' tap.txt || true)
          echo "passed=$passed failed=$failed"
          test "$failed" -eq 5 && test "$passed" -eq 14

  security:
    name: Security · secrets and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the full history with the pinned gitleaks CLI. (gitleaks-action scans
      # `first^..last` of the push and fails on a repository's root commit.)
      - name: Secret scan (gitleaks, full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner --exit-code 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip install -e backend
          pip-audit --skip-editable --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
