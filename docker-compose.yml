# FORGE-0 local stack.
#
#   docker compose up -d db                 # PostgreSQL only (backend/frontend run on the host)
#   docker compose --profile app up -d      # full stack: db + backend + frontend
#   scripts/lite.ps1 start                  # lightweight mode (see docker-compose.lite.yml)
#
# Security note: in the full stack the *backend* container talks to the Docker daemon in
# order to launch experiment sandboxes, so the daemon socket is mounted into the backend
# only. Experiment containers never receive the socket, host mounts, network or secrets
# (see docs/SECURITY.md).
name: forge0

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
      POSTGRES_DB: forge0
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge0"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://forge:${POSTGRES_PASSWORD:-forge}@db:5432/forge0
      DATA_DIR: /data
      SANDBOX_DOCKER_COMMAND: docker
      CORS_ORIGINS: http://localhost:8090,http://127.0.0.1:8090
    volumes:
      - forge-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8090}:80"
    depends_on:
      - backend
    mem_limit: 128m
    restart: unless-stopped

volumes:
  pgdata:
  forge-data:
