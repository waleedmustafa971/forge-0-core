[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# The URL is taken from DATABASE_URL (see alembic/env.py); this value is only a fallback.
sqlalchemy.url = postgresql+psycopg://forge:forge@127.0.0.1:5433/forge0

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
